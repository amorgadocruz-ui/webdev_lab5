<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Form</title>
  <style>
    /* h2 keeps heading levels valid; sized to look like the sample's h3 */
    fieldset h2 { font-size: 1.17em; }
  </style>
</head>
<body>
  <h1>Volunteer Form</h1>

  <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">

    <fieldset>
      <legend>My Info</legend>

      <label for="first_name_field">first name:</label>
      <input type="text" id="first_name_field" name="first_name_field" size="140"><br>

      <label for="last_name_field">last name:</label>
      <input type="text" id="last_name_field" name="last_name_field" size="140"><br>

      <label for="phone_field">phone:</label>
      <input type="text" id="phone_field" name="phone_field" size="140"><br>

      <label for="email_field">email:</label>
      <input type="text" id="email_field" name="email_field" size="140"><br>

      Gender:<br>
      <label for="gender_male">Male</label>
      <input type="radio" id="gender_male" name="gender_field" value="male">
      <label for="gender_female">Female</label>
      <input type="radio" id="gender_female" name="gender_field" value="female"><br>

      <label for="age_field">Age:</label><br>
      <select id="age_field" name="age_field">
        <option value="under 18">under 18</option>
        <option value="over 18">over 18</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>

      <h2>Days Available:</h2>

      <label for="available_sunday">Sunday</label>
      <input type="checkbox" id="available_sunday" name="available_field[]" value="Sunday"><br>

      <label for="available_monday">Monday</label>
      <input type="checkbox" id="available_monday" name="available_field[]" value="Monday"><br>

      <label for="available_tuesday">Tuesday</label>
      <input type="checkbox" id="available_tuesday" name="available_field[]" value="Tuesday"><br>

      <label for="available_wednesday">Wednesday</label>
      <input type="checkbox" id="available_wednesday" name="available_field[]" value="Wednesday"><br>

      <label for="available_thursday">Thursday</label>
      <input type="checkbox" id="available_thursday" name="available_field[]" value="Thursday"><br>

      <label for="available_friday">Friday</label>
      <input type="checkbox" id="available_friday" name="available_field[]" value="Friday"><br>

      <label for="available_saturday">Saturday</label>
      <input type="checkbox" id="available_saturday" name="available_field[]" value="Saturday"><br>

      <h2><label for="comments_field">Comments</label></h2>
      <textarea id="comments_field" name="comments_field" rows="2" cols="20"></textarea>
    </fieldset>

    <input type="hidden" id="hidden_field" name="hidden_field" value="Axel Morgado Cruz">

    <input type="submit" value="Submit Query">
  </form>
</body>
</html>
